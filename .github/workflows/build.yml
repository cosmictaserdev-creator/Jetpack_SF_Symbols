name: Build Kotlin Multiplatform library

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gradle-tasks: >-
              :sfsymbols:compileAndroidMain
              :sfsymbols:compileKotlinJvm
              :sfsymbols:compileKotlinJs
              :sfsymbols:compileKotlinWasmJs
          - os: windows-latest
            gradle-tasks: >-
              :sfsymbols:compileAndroidMain
              :sfsymbols:compileKotlinJvm
          - os: macos-latest
            gradle-tasks: >-
              :sfsymbols:compileAndroidMain
              :sfsymbols:compileKotlinJvm
              :sfsymbols:compileKotlinJs
              :sfsymbols:compileKotlinWasmJs
              :sfsymbols:compileKotlinIosArm64
              :sfsymbols:compileKotlinIosSimulatorArm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile targets
        shell: bash
        run: ./gradlew ${{ matrix.gradle-tasks }} --no-daemon --stacktrace
